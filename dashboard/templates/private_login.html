<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Manager OS | Private Access</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#edf4fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    .card{width:min(430px,100%);background:#0d1a29;border:1px solid #23364c;border-radius:18px;padding:30px;box-shadow:0 22px 70px rgba(0,0,0,.35)}
    .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8fa8c2;font-weight:800;margin-bottom:8px}
    h1{font-size:28px;line-height:1.1;margin:0 0 8px}
    p{color:#aebed0;line-height:1.5;margin:0 0 24px}
    label{display:block;font-size:13px;font-weight:800;color:#d8e4ef;margin:16px 0 7px}
    input{width:100%;border-radius:10px;border:1px solid #314761;background:#08131f;color:#fff;padding:13px 14px;font-size:16px;outline:none}
    input:focus{border-color:#6ba6d9;box-shadow:0 0 0 3px rgba(107,166,217,.14)}
    button{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:900;background:#e7f0f8;color:#09131f;cursor:pointer}
    .error{background:#3b151a;border:1px solid #7d2d38;color:#ffd8dd;border-radius:10px;padding:11px 12px;margin-bottom:16px;font-size:14px}
    .foot{margin-top:22px;font-size:12px;color:#71869b;text-align:center}
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">Private Municipal Operations</div>
    <h1>City Manager OS</h1>
    <p>Sign in to the private executive and operational dashboard.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign In</button>
    </form>

    <div class="foot">Executive, Supervisor and Read-only roles are supported.</div>
  </main>
</body>
</html>

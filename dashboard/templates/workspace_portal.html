<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your request</title><link rel="stylesheet" href="/static/workspace.css?v=1"></head><body><main class="portal"><span class="eyebrow">YOUR REQUEST</span><h1>{{ record.title }}</h1><p>Status: <strong>{{ record.status }}</strong></p><p class="muted">This link shows only this request's public conversation. Keep the link private.</p>{% for message in messages %}<article class="panel"><span class="badge">{{ 'You' if message.author=='REQUESTER' else 'Staff' }}</span><p class="preserve">{{ message.body }}</p><span class="muted small">{{ message.created_at }}</span></article>{% endfor %}<form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Add information<textarea name="body" rows="5" maxlength="4000" required></textarea></label><button class="primary">Add to request</button></form></main></body></html>

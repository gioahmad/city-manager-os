services:
  citymanager-dashboard:
    build: .
    container_name: citymanager-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: citymanager-postgis
      DB_PORT: 5432
      DB_NAME: citymanager
      DB_USER: citymanager_app
      STAFF_UPLOAD_DIR: /app/uploads
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:8090:8000"
    volumes:
      - /var/lib/city-manager-os/staff_uploads:/app/uploads
    networks:
      - citymanager

  citymanager-staff:
    image: dashboard-citymanager-dashboard:latest
    container_name: citymanager-staff
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: citymanager-postgis
      DB_PORT: 5432
      DB_NAME: citymanager
      DB_USER: citymanager_app
      STAFF_UPLOAD_DIR: /app/uploads
      STAFF_SECURE_COOKIES: "${STAFF_SECURE_COOKIES:-false}"
      STAFF_TRUST_PROXY: "${STAFF_TRUST_PROXY:-false}"
      STAFF_PUBLIC_ORIGIN: "${STAFF_PUBLIC_ORIGIN:-}"
      STAFF_ALLOWED_HOSTS: "${STAFF_ALLOWED_HOSTS:-*}"
      STAFF_LOGIN_MAX_FAILURES: "${STAFF_LOGIN_MAX_FAILURES:-8}"
      STAFF_LOGIN_WINDOW_SECONDS: "${STAFF_LOGIN_WINDOW_SECONDS:-900}"
    command:
      - uvicorn
      - employee_public_app:staff_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "${STAFF_BIND_IP:-0.0.0.0}:8091:8000"
    volumes:
      - /var/lib/city-manager-os/staff_uploads:/app/uploads
    networks:
      - citymanager

networks:
  citymanager:
    external: true

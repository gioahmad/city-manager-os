services:
  citymanager-dashboard:
    build: .
    container_name: citymanager-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: citymanager-postgis
      DB_PORT: 5432
      DB_NAME: citymanager
      DB_USER: citymanager_app
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:8090:8000"
    networks:
      - citymanager

  citymanager-staff:
    image: dashboard-citymanager-dashboard:latest
    container_name: citymanager-staff
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: citymanager-postgis
      DB_PORT: 5432
      DB_NAME: citymanager
      DB_USER: citymanager_app
    command:
      - uvicorn
      - employee_app:staff_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "0.0.0.0:8091:8000"
    networks:
      - citymanager

networks:
  citymanager:
    external: true

name: Navigation audit
on:
  push:
    branches: [workspace-cohesion-alert-geofilters]
    paths: ['.github/workflows/navigation-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive committed source for navigation review
        run: git archive --format=zip HEAD -o navigation-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: navigation-source
          path: navigation-source.zip
          retention-days: 1

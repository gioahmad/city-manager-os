name: Event Memory framework
on:
  push:
    branches: [event-memory-framework]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: event-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      transitdb:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cmos_tests
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d cmos_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize exact Event Memory candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,subprocess
          encoded=''.join(Path('ci/event-memory.part'+str(i)).read_text() for i in range(4))
          archive=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(archive).hexdigest()=='8b8f6013126c2bf14acb0827a9adde2e118322523c412ec5664df818ed105e31'
          patch=lzma.decompress(archive)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('ci/check_event_memory.py');s=p.read_text()
          a=s.index("other_cookie = auth._issue_session");b=s.index("client.cookies.set(auth.COOKIE_NAME, auth._issue_session(auth.Account('Reader'",a)
          s=s[:a]+'''# Exercise a genuinely registered second login, not a rejected session.
          import hmac
          os.environ.update(CMOS_SUPERVISOR_USERNAME='SomeoneElse', CMOS_SUPERVISOR_PASSWORD_HASH='unused')
          other_cookie = auth._issue_session(auth.Account('SomeoneElse', 'SUPERVISOR', 'unused'))
          client.cookies.clear()
          client.cookies.set(auth.COOKIE_NAME, other_cookie)
          other_csrf = hmac.new(auth._session_secret(), other_cookie.encode(), hashlib.sha256).hexdigest()
          other_page = client.get('/event-memory?kind=EVENT&id='+str(event['id']), follow_redirects=False)
          assert other_page.status_code == 200 and 'Program.pdf' not in other_page.text
          assert client.post('/event-memory/api/grant', json={'id':values['id'],'csrf':csrf}).status_code == 403
          # Even when this separate owner has a vault configured, rows/receipts remain owner-bound.
          os.environ['EVENT_MEMORY_OWNER'] = 'SomeoneElse'
          denied = client.post('/event-memory/api/grant', json={'id':values['id'],'purpose':'download','csrf':other_csrf})
          assert denied.status_code == 404, (denied.status_code, denied.text)
          denied = client.post('/event-memory/api/finalize', json={**receipt,'csrf':other_csrf})
          assert denied.status_code == 403, (denied.status_code, denied.text)
          print('EVENT MEMORY PASS: registered second owner cannot read metadata, redeem grants or finalize another owner receipt')
          client.cookies.clear()
          '''+s[b:]
          p.write_text(s)
          print('Exact candidate applied and registered-owner fixture corrected; production untouched')
          PY
          git diff --check
      - name: Install test dependencies
        run: python -m pip install -q -r dashboard/requirements.txt playwright
      - name: NAS bridge storage and security tests
        run: python -m pytest -q services/event_memory_bridge/test_bridge.py
      - name: Full dashboard regression
        working-directory: dashboard
        env:
          DB_PASSWORD: ci-test-only
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -ra tests
      - name: Transit query on PostgreSQL 17 at scale
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_transit_query.py
      - name: Real database save and Microsoft operation lifecycle
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_microsoft_workflows.py
      - name: Event Memory real database and NAS receipt lifecycle
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_event_memory.py
      - name: JavaScript and installer syntax
        run: |
          node --check dashboard/static/event_memory.js
          node --check dashboard/static/microsoft_workspace.js
          node --check dashboard/static/workspace_hub.js
          node --check dashboard/static/workspace.js
          node --check dashboard/static/macro_layer.js
          bash -n deploy/workspace/install_workspace.sh
      - name: Install Firefox and Chromium
        run: python -m playwright install --with-deps firefox chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Existing browser regression
        run: python ci/check_release_browser.py
      - name: Existing authenticated navigation
        run: python ci/check_authenticated_navigation.py
      - name: Microsoft user workflows with real database in both browsers
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_microsoft_browser.py
      - name: Event Memory browser to NAS and PostgreSQL
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_event_memory_browser.py
      - name: Build NAS bridge image
        run: docker build -f services/event_memory_bridge/Dockerfile -t cmos-vault-bridge-check .
      - name: Build actual application image
        run: docker build -t cmos-release-check ./dashboard > "$RUNNER_TEMP/image-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/image-build.log"; exit 1; }
      - name: Packaged application regression
        run: |
          docker run --rm --entrypoint python -e DB_PASSWORD=ci-test-only -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/dashboard/tests:/app/tests:ro" -v "$PWD/deploy:/deploy:ro" \
            -v "$PWD/docs:/docs:ro" -v "$PWD/workflows:/workflows:ro" \
            -v "$PWD/dashboard:/dashboard:ro" -v "$PWD/dashboard/Dockerfile:/app/Dockerfile:ro" \
            -v "$PWD/dashboard/docker-compose.yml:/app/docker-compose.yml:ro" -v "$PWD/README.md:/README.md:ro" \
            cmos-release-check -m pytest -q -ra -p no:cacheprovider tests
      - name: Actual image routes
        run: |
          docker run --rm -i --entrypoint python -e DB_PASSWORD=ci-test-only cmos-release-check - <<'PY'
          from phase3_app import app
          required={'/','/my-day','/what-changed','/issues','/inbox','/intake','/workspace','/map','/alerts','/watchlist','/subscribers','/schedule','/event-intelligence','/transit','/spatial-reference','/source-health','/deliveries','/staff-admin','/operations-routines','/context/{item_kind}/{item_id}','/records/{record_id}','/email','/calendar','/important','/event-memory'}
          paths=[r.path for r in app.routes if 'GET' in (getattr(r,'methods',set()) or set())]
          assert not required-set(paths),required-set(paths)
          for path in ('/','/my-day','/issues','/intake','/workspace','/map','/alerts','/watchlist','/schedule','/email','/calendar','/important','/event-memory'):
              assert paths.count(path)==1,(path,paths.count(path))
          print('ROUTE CONTRACT: PASS — 25 required routes, no duplicate core handlers')
          PY
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: event-memory-evidence
          path: browser-check-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit verified readable framework on development branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,subprocess,base64,urllib.request
          assert os.environ['GITHUB_REF']=='refs/heads/event-memory-framework'
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/ref/heads/event-memory-framework',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=20) as response:head=json.load(response)['object']['sha']
          assert head==os.environ['GITHUB_SHA'],'Branch moved; refusing to overwrite changes'
          final=Path('ci/event-memory-final.yml')
          Path('.github/workflows/event-memory.yml').write_text(final.read_text())
          final.unlink()
          def git(*args,**kwargs):return subprocess.run(['git',*args],check=True,**kwargs)
          git('config','user.name','City Manager OS Release Checks')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('rm','--',*[str(p) for p in Path('ci').glob('event-memory.part*')])
          git('add','--','.github/workflows/event-memory.yml','dashboard','ci','deploy','docs','services')
          git('diff','--cached','--check')
          git('commit','-m','Add disabled private Event Memory framework after NAS and database verification')
          auth='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()
          env={**os.environ,'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':auth}
          git('push','origin','HEAD:refs/heads/event-memory-framework',env=env)
          git('rev-parse','HEAD')
          PY

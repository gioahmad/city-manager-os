name: Event Memory framework
on:
  push:
    branches: [event-memory-framework]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Export development source (not acceptance testing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: event-memory-source
          path: source.zip
          retention-days: 1

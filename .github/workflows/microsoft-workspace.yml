name: Microsoft workspace verification
on:
  push:
    branches: [microsoft-workspace-actions]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: microsoft-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      transitdb:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cmos_tests
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d cmos_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize hash-verified candidate source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,os
          parts=[Path('ci/ms-candidate.part'+str(i)) for i in range(8)]
          if not any(p.exists() for p in parts):
              raise SystemExit(0)
          raw=lzma.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(raw).hexdigest()=='6a9bcffe00b3cda015c6799aefa056d3c662cce05cd76eb7eb976ac89974b8fa'
          manifest=json.loads(raw);prepared=[]
          for row in manifest:
              path=Path(row['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.parts[0] in {'dashboard','ci','deploy','docs'} and '.env' not in path.name
              before=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==row['before'],str(path)
              content=(before or b'').decode('utf-8')
              for start,end,replacement in reversed(row['edits']):
                  content=content[:start]+replacement+content[end:]
              assert hashlib.sha256(content.encode()).hexdigest()==row['after'],str(path)
              prepared.append((path,content))
          for path,content in prepared:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          # Fix a pre-existing correlated-query bug caught by the real source preview.
          def replace(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,s.count(old));p.write_text(s.replace(old,new))
          replace('dashboard/workspace_hub.py',"SELECT id,name,attributes,visibility FROM workspace_entities WHERE (visibility='WORK' OR owner_username=%s)\n        AND (contact_id IS NULL OR EXISTS(SELECT 1 FROM contacts c WHERE c.id=contact_id AND c.active AND c.visibility='ALL'))\n        ORDER BY updated_at DESC LIMIT 500", "SELECT e.id,e.name,e.attributes,e.visibility FROM workspace_entities e WHERE (e.visibility='WORK' OR e.owner_username=%s)\n        AND (e.contact_id IS NULL OR EXISTS(SELECT 1 FROM contacts c WHERE c.id=e.contact_id AND c.active AND c.visibility='ALL'))\n        ORDER BY e.updated_at DESC LIMIT 500")
          replace('ci/check_microsoft_workflows.py',"    base={'kind':'MAIL'", "    detail=client.get('/workspace/api/hub/detail/MAIL/'+mail_id)\n    assert detail.status_code==200 and detail.json()['item']['id']==mail_id\n    assert detail.json()['item']['title']=='Fixture contractor email'\n    assert client.get('/workspace/api/microsoft/status').status_code==200\n    passed('Actual source-detail query and connection status work against real contact and workspace schemas')\n    base={'kind':'MAIL'")
          replace('deploy/workspace/install_workspace.sh',"'/workspace/api/hub','/workspace/api/hub?view=library')", "'/workspace/api/hub','/workspace/api/hub?view=library',\n             '/email','/calendar','/important','/workspace/api/microsoft/status')")
          Path(os.environ['RUNNER_TEMP'],'candidate-files.json').write_text(json.dumps([str(p) for p,_ in prepared]))
          print('Candidate source materialized:',len(prepared),'files; all before/after hashes verified, source-preview correction applied')
          PY
          git diff --check
      - name: Install test dependencies
        run: python -m pip install -q -r dashboard/requirements.txt playwright
      - name: Full dashboard regression
        working-directory: dashboard
        env:
          DB_PASSWORD: ci-test-only
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -ra tests
      - name: Transit query on PostgreSQL 17 at scale
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_transit_query.py
      - name: Real database save and Microsoft operation lifecycle
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_microsoft_workflows.py
      - name: JavaScript and installer syntax
        run: |
          node --check dashboard/static/microsoft_workspace.js
          node --check dashboard/static/workspace_hub.js
          node --check dashboard/static/workspace.js
          node --check dashboard/static/macro_layer.js
          bash -n deploy/workspace/install_workspace.sh
      - name: Install Firefox and Chromium
        run: python -m playwright install --with-deps firefox chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Existing browser regression
        run: python ci/check_release_browser.py
      - name: Existing authenticated navigation
        run: python ci/check_authenticated_navigation.py
      - name: Microsoft user workflows with real database in both browsers
        env:
          CMOS_TEST_POSTGRES_DSN: postgresql://postgres:ci-test-only@127.0.0.1:${{ job.services.transitdb.ports[5432] }}/cmos_tests
        run: python ci/check_microsoft_browser.py
      - name: Build actual application image
        run: docker build -t cmos-release-check ./dashboard > "$RUNNER_TEMP/image-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/image-build.log"; exit 1; }
      - name: Packaged application regression
        run: |
          docker run --rm --entrypoint python -e DB_PASSWORD=ci-test-only -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/dashboard/tests:/app/tests:ro" -v "$PWD/deploy:/deploy:ro" \
            -v "$PWD/docs:/docs:ro" -v "$PWD/workflows:/workflows:ro" \
            -v "$PWD/dashboard:/dashboard:ro" -v "$PWD/dashboard/Dockerfile:/app/Dockerfile:ro" \
            -v "$PWD/dashboard/docker-compose.yml:/app/docker-compose.yml:ro" -v "$PWD/README.md:/README.md:ro" \
            cmos-release-check -m pytest -q -ra -p no:cacheprovider tests
      - name: Actual image routes
        run: |
          docker run --rm -i --entrypoint python -e DB_PASSWORD=ci-test-only cmos-release-check - <<'PY'
          from phase3_app import app
          required={'/','/my-day','/what-changed','/issues','/inbox','/intake','/workspace','/map','/alerts','/watchlist','/subscribers','/schedule','/event-intelligence','/transit','/spatial-reference','/source-health','/deliveries','/staff-admin','/operations-routines','/context/{item_kind}/{item_id}','/records/{record_id}','/email','/calendar','/important'}
          paths=[r.path for r in app.routes if 'GET' in (getattr(r,'methods',set()) or set())]
          assert not required-set(paths),required-set(paths)
          for path in ('/','/my-day','/issues','/intake','/workspace','/map','/alerts','/watchlist','/schedule','/email','/calendar','/important'):
              assert paths.count(path)==1,(path,paths.count(path))
          print('ROUTE CONTRACT: PASS — 24 required routes, no duplicate core handlers')
          PY
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microsoft-workspace-evidence
          path: browser-check-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit verified readable source on development branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,subprocess,base64,urllib.request
          listing=Path(os.environ['RUNNER_TEMP'],'candidate-files.json')
          if not listing.exists():raise SystemExit(0)
          assert os.environ['GITHUB_REF']=='refs/heads/microsoft-workspace-actions'
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN']
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/ref/heads/microsoft-workspace-actions',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r:head=json.load(r)['object']['sha']
          assert head==os.environ['GITHUB_SHA'],'Branch moved; refusing to overwrite changes'
          def git(*args,**kw):return subprocess.run(['git',*args],check=True,**kw)
          git('config','user.name','City Manager OS Release Checks')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','--',*json.loads(listing.read_text()))
          git('rm','--',*[str(p) for p in Path('ci').glob('ms-candidate.part*')])
          git('diff','--cached','--check')
          git('commit','-m','Add reviewed Microsoft Email, Calendar and Important workflows after isolated verification')
          encoded=base64.b64encode(('x-access-token:'+token).encode()).decode()
          print('::add-mask::'+encoded,flush=True)
          auth='AUTHORIZATION: basic '+encoded
          env={**os.environ,'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':auth}
          git('push','origin','HEAD:refs/heads/microsoft-workspace-actions',env=env)
          git('rev-parse','HEAD')
          PY

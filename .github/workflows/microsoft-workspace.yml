name: Microsoft workspace verification
on:
  push:
    branches: [microsoft-workspace-actions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: microsoft-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export committed source for isolated implementation
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microsoft-workspace-source
          path: source.zip
          retention-days: 1

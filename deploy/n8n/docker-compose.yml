services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND_IP:-127.0.0.1}:5678:5678"
    environment:
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL in .env}
      - N8N_HOST=${N8N_HOST:?Set N8N_HOST in .env}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
    extra_hosts:
      - "${NTFY_HOSTNAME:-ntfy.nhnj.us}:${NTFY_HOST_IP:?Set NTFY_HOST_IP in .env}"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - default
      - citymanager

volumes:
  n8n_data:
    name: n8n_n8n_data

networks:
  citymanager:
    external: true

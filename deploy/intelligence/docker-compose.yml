services:
  citymanager-intake:
    image: "${CMOS_INTAKE_IMAGE:-dashboard-citymanager-dashboard:latest}"
    container_name: citymanager-intake
    restart: unless-stopped
    env_file:
      - ../../dashboard/.env
    environment:
      DB_HOST: citymanager-postgis
      DB_PORT: 5432
      DB_NAME: citymanager
      DB_USER: citymanager_app
      DB_POOL_MIN: "${DB_POOL_MIN:-1}"
      DB_POOL_MAX: "${DB_POOL_MAX:-6}"
      DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-5}"
      TZ: "${APP_TIMEZONE:-America/New_York}"
      PGTZ: "${APP_TIMEZONE:-America/New_York}"
    command: [python, workspace_ingest.py]
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/workspace-intake-heartbeat').read_text())<300"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [citymanager]
networks:
  citymanager:
    external: true
